[project]
name = "lrcdownloader"
version = "0.1.0"
description = "Desktop LRC downloader (SongSync port): batch-fetch synced lyrics, sidecar .lrc + tag embed"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "PySide6>=6.7",
  "mutagen>=1.47",
  "httpx>=0.27",
  "syncedlyrics>=1.0",
  "rapidfuzz>=3.0",
  "platformdirs>=4.0",
  "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lrcdownloader*"]
